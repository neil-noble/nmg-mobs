trigger:
  service: cron-job.org
  job_id: 8711243
  title: NMG Mobilisation Compliance hourly :05
  fires: every hour at :05 Australia/Perth -> POST workflow_dispatch mobs.yml ref master (06:05 run sends the email)
  built: 2026-10-24 via REST API, headers copied from OHS job 8705425; notify onFailure x3 + onDisable
  pat: own fine-grained PAT 'nmg-mobs cron-job.org' supplied by Neil 2026-10-24 (pasted in chat), stored ONLY in the job's extendedData.headers. Never change its expiry (rotates the value)
  status: WORKING - verified 2026-10-24: first replay 403 (token lacked actions=write); Neil edited the token in place (value unchanged); stored request replayed -> HTTP 204 -> run 40062276815 success, email correctly skipped (already sent)
